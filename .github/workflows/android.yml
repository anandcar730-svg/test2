# Builds the Driver Log Shalom Android app and publishes the APK at a fixed download link:
#   https://github.com/<owner>/<repo>/releases/download/android-app/driver-log-shalom.apk
name: Android app

on:
  push:
    paths:
      - 'fleet-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PRIVATE_KEY: ${{ secrets.DRIVERLOG_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already have the Android SDK (ANDROID_HOME); missing platforms are fetched by Gradle.
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: your own private signing key (Settings → Secrets → Actions: DRIVERLOG_KEYSTORE_B64 + DRIVERLOG_KEYSTORE_PASSWORD)
      - name: Use private signing key (if configured)
        if: env.HAS_PRIVATE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.DRIVERLOG_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/driverlog.p12"
          echo "DRIVERLOG_KEYSTORE_FILE=$RUNNER_TEMP/driverlog.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: fleet-android
        env:
          DRIVERLOG_KEYSTORE_PASSWORD: ${{ secrets.DRIVERLOG_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp fleet-android/app/build/outputs/apk/release/app-release.apk driver-log-shalom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: driver-log-shalom-apk
          path: driver-log-shalom.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          target_commitish: ${{ github.sha }}
          name: Driver Log Shalom – Android app
          body: |
            **Driver Log Shalom** Android app (build ${{ github.run_number }}, ${{ github.ref_name }} @ ${{ github.sha }}).

            Download **driver-log-shalom.apk** below on the Android phone, open it, allow "Install unknown apps" for your browser when asked, and install.
            Updates install over the previous version.
          files: driver-log-shalom.apk
          overwrite_files: true
          make_latest: false

  # Installs the APK on an Android emulator, opens it, and saves a screenshot + any crash log.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: driver-log-shalom-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r driver-log-shalom.apk
            adb logcat -c
            adb shell am start -W -n org.shalomchurch.driverlog/.MainActivity || true
            sleep 25
            adb shell pidof org.shalomchurch.driverlog > pid.txt || echo "NOT RUNNING" > pid.txt
            echo "app process: $(cat pid.txt)"
            adb exec-out screencap -p > screen-1.png || true
            adb logcat -d -v time > logcat.txt || true
            grep -n -A40 "FATAL EXCEPTION" logcat.txt > crash.txt || echo "no crash" > crash.txt
            echo "===== crash ====="; cat crash.txt | head -80
            echo "===== app log ====="; grep -E "driverlog|chromium|AndroidRuntime" logcat.txt | tail -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-result
          path: |
            screen-1.png
            logcat.txt
            crash.txt
            pid.txt
