# Builds the Driver Log Shalom Android app and publishes the APK at a fixed download link:
#   https://github.com/<owner>/<repo>/releases/download/android-app/driver-log-shalom.apk
name: Android app

on:
  push:
    paths:
      - 'fleet-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PRIVATE_KEY: ${{ secrets.DRIVERLOG_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: your own private signing key (Settings → Secrets → Actions: DRIVERLOG_KEYSTORE_B64 + DRIVERLOG_KEYSTORE_PASSWORD)
      - name: Use private signing key (if configured)
        if: env.HAS_PRIVATE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.DRIVERLOG_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/driverlog.p12"
          echo "DRIVERLOG_KEYSTORE_FILE=$RUNNER_TEMP/driverlog.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: fleet-android
        env:
          DRIVERLOG_KEYSTORE_PASSWORD: ${{ secrets.DRIVERLOG_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp fleet-android/app/build/outputs/apk/release/app-release.apk driver-log-shalom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: driver-log-shalom-apk
          path: driver-log-shalom.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          target_commitish: ${{ github.sha }}
          name: Driver Log Shalom – Android app
          body: |
            **Driver Log Shalom** Android app (build ${{ github.run_number }}, ${{ github.ref_name }} @ ${{ github.sha }}).

            Download **driver-log-shalom.apk** below on the Android phone, open it, allow "Install unknown apps" for your browser when asked, and install.
            Updates install over the previous version.
          files: driver-log-shalom.apk
          overwrite_files: true
          make_latest: false
